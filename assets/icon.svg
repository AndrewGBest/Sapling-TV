<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Sapling TV icon. Original artwork for this project: a seedling whose
       right leaf carries a play mark, on a green dawn tile. Deliberately no
       fruit and no round shapes that could read as one, and nothing taken
       from any service's branding (CLAUDE.md, Hard rules 1 and 5). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2b27"/>
      <stop offset="0.62" stop-color="#1d6450"/>
      <stop offset="1" stop-color="#7cc26a"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#b6ee7a"/>
      <stop offset="1" stop-color="#f2ffd9"/>
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <path d="M0 452 C 120 418, 392 418, 512 452 L 512 512 L 0 512 Z" fill="#0a221e"/>
    <path d="M256 446 C 250 384, 264 330, 256 262" stroke="#f2ffd9" stroke-width="18" stroke-linecap="round" fill="none"/>
    <path d="M252 292 C 196 306, 118 272, 98 172 C 184 164, 244 214, 252 292 Z" fill="url(#leaf)"/>
    <path d="M259 266 C 286 188, 358 116, 438 122 C 434 220, 352 284, 259 266 Z" fill="url(#leaf)"/>
    <path d="M326 168 L 380 199 L 326 230 Z" fill="#1d6450"/>
  </g>
</svg>
