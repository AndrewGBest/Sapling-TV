<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sapling TV fixture: a made-up streaming home</title>
<!-- A made-up layout for testing. It imitates no real service and uses no real artwork or titles. -->
<style>
  body { margin: 0; background: #111; color: #eee; font: 16px system-ui, sans-serif; }
  nav { display: flex; gap: 16px; padding: 16px 32px; }
  nav a, .card, button { color: #eee; background: #2a2a2a; border: 0; border-radius: 8px; text-decoration: none; }
  nav a { padding: 10px 18px; }
  h2 { margin: 24px 32px 8px; font-size: 18px; }
  .row { display: flex; gap: 16px; padding: 0 32px; }
  .card { display: block; width: 200px; height: 112px; flex: none; }
  .offer { margin: 24px 32px; display: flex; gap: 16px; }
  .offer button { padding: 12px 20px; font-size: 16px; }
</style>
</head>
<body>
<nav>
  <a href="#home" id="nav-home">Home</a>
  <a href="#shop" id="nav-shop">Shop</a>
</nav>
<h2>Keep watching</h2>
<div class="row" id="row1">
  <a class="card" href="#t1" id="t1" aria-label="Fixture title one"></a>
  <a class="card" href="#t2" id="t2" aria-label="Fixture title two"></a>
  <a class="card" href="#t3" id="t3" aria-label="Fixture title three"></a>
</div>
<div class="offer">
  <button id="play">Play</button>
  <button id="trial">Start free trial</button>
</div>
<script>
  // Records what the page itself received, so a test can tell a blocked click from a delivered one.
  window.__clicks = [];
  document.addEventListener('click', (e) => {
    const id = e.target.closest('[id]')?.id;
    if (id) window.__clicks.push(id);
  });
</script>
</body>
</html>
